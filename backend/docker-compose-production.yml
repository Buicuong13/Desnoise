name: denoise-prod

# Production stack for a single AWS EC2 host (git clone + docker compose up).
# It runs ONLY the things that live on AWS:
#   - api        : the FastAPI HTTP server
#   - worker-llm     : serialized LLM jobs (no GPU needed)
#   - worker-payment : isolated payment follow-ups
#
# It deliberately does NOT run postgres/redis — production uses Supabase
# (Postgres) and Upstash (Redis) via .env.production. The GPU worker
# (denoise/classify/ocr) runs SEPARATELY on RunPod, not here.
#
# IMPORTANT: .env.production is gitignored, so `git clone` will NOT bring it.
# Copy/scp it onto the EC2 host (next to this file) before `docker compose up`.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: denoise-api:prod          # build once, reused by CPU workers below
    container_name: denoise_api
    restart: unless-stopped
    env_file:
      - .env.production
    # Run migrations against Supabase (no-op if already at head), then serve.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker-llm:
    image: denoise-api:prod
    container_name: denoise_worker_llm
    restart: unless-stopped
    env_file:
      - .env.production
    # One page at a time prevents multiple tasks from exceeding a provider's
    # account-wide concurrency limit. Each page can still batch its chunks
    # according to LLM_MAX_CONCURRENCY / OLLAMA_MAX_CONCURRENCY.
    # --without-* disables gossip/mingle/heartbeat: inter-worker chatter that
    # polls Redis constantly even when idle (the bulk of the Upstash read quota).
    command: celery -A app.workers.celery_app worker -Q llm_queue -c 1 --without-gossip --without-mingle --without-heartbeat --loglevel=info
    depends_on:
      - api

  worker-payment:
    image: denoise-api:prod
    container_name: denoise_worker_payment
    restart: unless-stopped
    env_file:
      - .env.production
    command: celery -A app.workers.celery_app worker -Q payment_queue -c 1 --without-gossip --without-mingle --without-heartbeat --loglevel=info
    depends_on:
      - api
